<!DOCTYPE html>
<html>
<head>
    <title>CHRISTOPHER MAINA CV</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('maina.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            padding: 1px;
        }

        .dashboard {
            background-color: rgba(255,255,255,0.93);
            max-width: 650px;
            margin: 90px auto;
            padding: 35px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        h2 {
            color: #176b35;
            margin-top: 10px;
            margin-bottom: 35px;
            font-size: 28px;
        }

        .menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .menu a {
            display: inline-block;
            background-color: #218838;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            width: 150px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .menu a:hover {
            background-color: #145a28;
            transform: translateY(-3px);
        }

        .extra {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 25px;
            font-weight: bold;
        }

        .extra:hover {
            background-color: #555;
        }

        @media (max-width: 600px) {
            .dashboard {
                margin: 40px 15px;
                padding: 25px 15px;
            }

            .menu a {
                width: 100%;
                box-sizing: border-box;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h2>CHRISTOPHER MAINA CV</h2>

        <div class="menu">
            <a href="education.html">Education</a>
            <a href="contact me.html">Contact</a>
            <a href="About me.html">About Me</a>
            <a href="skills.html">Skills</a>
            <a href="work experience.html">Work Experience</a>
        </div>

        <a class="extra" href="BIT201.html">Table and Forms</a>

    </div>

</body>
</html>
